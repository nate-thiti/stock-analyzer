services:
  backend:
    build: ./backend
    ports:
      - "8010:8010"
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      # Local Docker ใช้ SQLite เสมอ — ไม่อ่าน DATABASE_URL จาก .env (Neon/Render)
      # ถ้าต้องการ Postgres ใน Docker: ใช้ docker-compose.prod.yml หรือ override เอง
      DATABASE_URL: sqlite:////data/app.db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      APP_ENV: ${APP_ENV:-development}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-admin}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-admin@example.com}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin1234}
      BMC_URL: ${BMC_URL:-}
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BMC_URL: ${VITE_BMC_URL:-}
    ports:
      - "3010:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

volumes:
  app-data:
