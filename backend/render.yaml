# Render Blueprint — สร้าง Web Service จาก repo นี้
# Dashboard → New → Blueprint → เลือก repo (rootDir = backend)

services:
  - type: web
    name: stock-analyzer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: BMC_URL
        sync: false
