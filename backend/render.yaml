# Render Blueprint — สร้าง Web Service จาก repo นี้
# Dashboard → New → Blueprint → เลือก repo (rootDir = backend)

services:
  - type: web
    name: stock-analyzer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: BMC_URL
        sync: false
      - key: QUOTE_CACHE_SECONDS
        value: "300"
      - key: HISTORY_CACHE_SECONDS
        value: "600"
      - key: RAW_CACHE_SECONDS
        value: "21600"
      - key: RAW_STALE_CACHE_SECONDS
        value: "86400"
      - key: STALE_CACHE_SECONDS
        value: "3600"
      - key: YAHOO_TIMEOUT_SECONDS
        value: "12"
      - key: YAHOO_MAX_WORKERS
        value: "4"
