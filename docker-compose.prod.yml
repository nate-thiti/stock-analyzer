# Production override — ใช้คู่กับ docker-compose.yml
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  backend:
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      APP_ENV: production
      # ใช้ Postgres/Neon จาก .env หรือ shell — override sqlite ของ docker-compose.yml
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for production docker}

  frontend:
    ports:
      - "127.0.0.1:3010:80"
